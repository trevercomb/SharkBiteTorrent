# Builds Windows, Linux (on Arch, for CachyOS) and macOS, and publishes them
# as a GitHub Release when a version tag (v1.2.3) is pushed. Running it by hand
# (Actions → Release → Run workflow) builds everything without releasing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job can write (to publish).
permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0
  GOTOOLCHAIN: auto # honour the toolchain line in go.mod (patched Go)

jobs:
  windows:
    runs-on: windows-2025
    # bash everywhere: PowerShell doesn't stop when a command fails, so a
    # multi-command step only failed if its LAST command did (Windows test
    # failures passed Checks unnoticed until a release build caught them).
    defaults: { run: { shell: bash } }
    # The runner has MinGW, so cgo would switch on and link its C++ runtime
    # (DLLs most PCs don't have). Off, the app is pure Go, like the builds
    # the leak tests run against.
    env: { CGO_ENABLED: "0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # No cache: a release must not build from a cache another workflow wrote.
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${GITHUB_REF_NAME#v}\"/" wails.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install NSIS 3.13 (official zip, checked against a pinned SHA-256)
        shell: bash
        run: |
          curl -sSfL -o nsis.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          echo "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8  nsis.zip" | sha256sum -c -
          unzip -q nsis.zip -d "$RUNNER_TEMP"
      - name: Build
        shell: bash
        run: |
          export PATH="$PATH:$RUNNER_TEMP/nsis-3.13"
          wails build -clean -trimpath -ldflags "-s -w" -nsis -installscope user
          ls -la build/bin
          go run scripts/check-pe-imports.go build/bin/SharkBiteTorrent.exe
          # Certificates are checked in Go, not by the OS (roots.go): make sure
          # the setting made it into the program that ships.
          go version -m build/bin/SharkBiteTorrent.exe | grep -q 'x509usefallbackroots=1' || { echo "x509usefallbackroots=1 isn't in the built program"; exit 1; }
      - name: Test
        # After the build: the Go code embeds frontend/dist, which the build creates.
        run: go test ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/bin/SharkBiteTorrent.exe
            build/bin/SharkBiteTorrent-amd64-installer.exe

  linux:
    # Built on the oldest supported Ubuntu so the binary's glibc and library
    # versions are old enough to run on Debian/Ubuntu as well as Arch/CachyOS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # No cache: a release must not build from a cache another workflow wrote.
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$v\"/" wails.json
          sed -i "s/^_version=.*/_version=$v/" packaging/arch/PKGBUILD
      - name: Build
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -trimpath -ldflags "-s -w" -tags webkit2_41
          go vet -tags webkit2_41 ./...   # after the build: needs frontend/dist
          # Certificates are checked in Go, not by the OS (roots.go): make sure
          # the setting made it into the program that ships.
          go version -m build/bin/SharkBiteTorrent | grep -q 'x509usefallbackroots=1' || { echo "x509usefallbackroots=1 isn't in the built program"; exit 1; }
      - name: Package tarball
        run: |
          v=$(sed -n 's/^_version=//p' packaging/arch/PKGBUILD)
          name="SharkBiteTorrent-${v}-linux-x86_64"
          mkdir -p "dist/$name"
          cp build/bin/SharkBiteTorrent packaging/linux/sharkbitetorrent.desktop LICENSE THIRD_PARTY_LICENSES.txt "dist/$name/"
          cp build/appicon.png "dist/$name/sharkbitetorrent.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp packaging/arch/PKGBUILD dist/
          # The shipped PKGBUILD checks the tarball (the repo copy says SKIP).
          sum=$(sha256sum "dist/$name.tar.gz" | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" dist/PKGBUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            dist/PKGBUILD

  arch:
    # Wraps the same binary in a pacman package for Arch / CachyOS.
    needs: linux
    runs-on: ubuntu-24.04
    # Pinned by digest (base-devel-20261004.0.606936), so a changed tag can't
    # change what builds the package.
    container: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux-tarball, path: pkg }
      - name: Build package
        run: |
          # makepkg refuses to run as root, so build the package as a normal user.
          useradd -m builder
          chown -R builder pkg
          su builder -c "cd pkg && makepkg --nodeps --noconfirm"
          mkdir dist && cp pkg/*.tar.gz pkg/*.pkg.tar.zst dist/
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst

  store:
    # Microsoft Store package. Not part of the GitHub release: it's unsigned
    # until Partner Center signs it. releasekey publish checks its build
    # provenance (below) and puts it in the maintainer's Downloads folder for
    # uploading to Partner Center. Not for betas (v0.3.0-beta.1): the Store
    # gets releases only, and its versions must be plain numbers.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: windows-2025
    # bash everywhere: PowerShell doesn't stop when a command fails, so a
    # multi-command step only failed if its LAST command did (Windows test
    # failures passed Checks unnoticed until a release build caught them).
    defaults: { run: { shell: bash } }
    env: { CGO_ENABLED: "0" } # see the windows job
    permissions:
      contents: read
      id-token: write     # for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # No cache: a release must not build from a cache another workflow wrote.
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${GITHUB_REF_NAME#v}\"/" wails.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build MSIX
        shell: bash
        run: packaging/msix/build-msix.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.msix'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix
          path: dist/*.msix

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # No cache: a release must not build from a cache another workflow wrote.
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${GITHUB_REF_NAME#v}\"/" wails.json
      - name: Build universal app
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          export PATH="$PATH:$(go env GOPATH)/bin"
          # macOS 13 is the oldest Go supports. Without these, the app's
          # Objective-C parts are built for the runner's own macOS, and the
          # app wouldn't start on older ones whatever Info.plist says.
          export CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0"
          wails build -clean -trimpath -ldflags "-s -w" -platform darwin/universal
          for arch in arm64 x86_64; do
            minos=$(vtool -arch $arch -show-build build/bin/*.app/Contents/MacOS/* | awk '/minos/ {print $2}' | sort -u)
            [ "$minos" = "13.0" ] || { echo "the $arch build needs macOS $minos, not 13.0"; exit 1; }
          done
          # Certificates are checked in Go, not by the OS (roots.go): make sure
          # the setting made it into the program that ships.
          go version -m build/bin/*.app/Contents/MacOS/SharkBiteTorrent | grep -q 'x509usefallbackroots=1' || { echo "x509usefallbackroots=1 isn't in the built program"; exit 1; }
          for app in build/bin/*.app; do cp LICENSE THIRD_PARTY_LICENSES.txt "$app/Contents/Resources/"; done
          # Unsigned builds still need an ad-hoc signature to launch on Apple Silicon.
          codesign --force --deep --sign - "build/bin/Shark BiteTorrent.app" || codesign --force --deep --sign - build/bin/*.app
          cd build/bin && ditto -c -k --keepParent *.app SharkBiteTorrent-macos-universal.zip
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: build/bin/SharkBiteTorrent-macos-universal.zip

  vulncheck:
    # Known vulnerabilities, checked again at release time: one published
    # after the commit's Checks ran still stops the release. On each OS,
    # since govulncheck only follows the code that's built for the OS it
    # runs on (keyring, D-Bus, the tray and Wails differ per platform).
    strategy:
      matrix:
        include:
          - { os: windows-2025, cgo: "0", goflags: "" } # release builds for Windows are pure Go
          - { os: ubuntu-22.04, cgo: "1", goflags: "-tags=webkit2_41" } # as the Linux release is built
          - { os: macos-26, cgo: "1", goflags: "" }
    runs-on: ${{ matrix.os }}
    # bash everywhere: PowerShell doesn't stop when a command fails, so a
    # multi-command step only failed if its LAST command did (Windows test
    # failures passed Checks unnoticed until a release build caught them).
    defaults: { run: { shell: bash } }
    env: { CGO_ENABLED: "${{ matrix.cgo }}", GOFLAGS: "${{ matrix.goflags }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: GTK and WebKitGTK headers (the Linux code is cgo)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: npm audit, and the frontend build the Go code embeds
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, arch, macos, vulncheck]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # for the provenance attestation below
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts, merge-multiple: true }
      - name: Checksums
        run: |
          # PKGBUILD only travels along for the arch job; it isn't a download.
          rm -f artifacts/PKGBUILD artifacts/*.msix
          # Checksums let the in-app updater verify what it downloads.
          (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la artifacts
      # GitHub-signed provenance: each file was built by this workflow from
      # this commit. releasekey publish checks it against the maintainer's own
      # copy of the tag before signing, so files swapped into the draft (or
      # built from a different commit or workflow) are refused.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*'
      # Release notes: this version's section of CHANGELOG.md, then the
      # downloads table. A tag without a CHANGELOG section fails here, so
      # every release says what changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: |
            CHANGELOG.md
            packaging/release-notes-footer.md
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # A beta's notes are the Unreleased section (what's been committed
          # since the last release); the app shows them the same way.
          h="## [$v]"
          case "$v" in *-*) h="## [Unreleased]";; esac
          awk -v h="$h" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' src/CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::CHANGELOG.md has no notes under '$h'; add what changed."
            exit 1
          fi
          {
            case "$v" in *-*) printf '%s\n\n' "**Beta:** a preview of the next release, for testing. Apps on the beta update channel (Settings → App) are offered it; everyone else stays on the latest release.";; esac
            echo "## What's new"; cat section.md; echo; cat src/packaging/release-notes-footer.md
          } > notes.md
          cat notes.md
          # A draft: the maintainer signs SHA256SUMS.txt on their own computer
          # (go run ./cmd/releasekey publish <tag>), which also publishes it.
          # The in-app updater only installs releases with a valid signature.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac # v0.3.0-rc1
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft $pre \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shark BiteTorrent $v" \
            --notes-file notes.md
