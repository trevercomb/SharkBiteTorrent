# Runs on every push and pull request: tests, type checks and the
# vulnerability scanners. Releases additionally go through RELEASING.md.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto # honour the toolchain line in go.mod (patched Go)

jobs:
  checks:
    runs-on: windows-2025 # the main platform; DPAPI and Defender tests run here
    env: { CGO_ENABLED: "0" } # test what ships: release builds are pure Go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh

      - name: Frontend (build, type check, npm audit)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npx svelte-check --threshold error
          npm audit --audit-level=high

      # After the frontend build: the Go code embeds frontend/dist.
      - name: Go vet (all build variants)
        run: |
          go vet ./...
          go vet -tags nofunding .
          go vet -tags store .
      - name: Go tests
        run: |
          go test -short ./...
          go test -short -tags nofunding -run TestLinks .
      - name: Patched go-webview2 is upstream + only the documented patch
        shell: bash
        run: scripts/check-webview2-patch.sh
      - name: govulncheck (known vulnerabilities in code the app calls)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The Linux and macOS code (build-tagged files: keyring, autostart, file
  # associations, ClamAV, leakcheck) is tested on its own platform.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Frontend build (the Go code embeds it)
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - run: go vet -tags webkit2_41 ./...
      - run: go test -short -tags webkit2_41 ./...
      - name: Race detector on the concurrent parts
        run: go test -short -race ./internal/dnsroute ./internal/engine ./internal/search ./internal/secret .

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download Go modules (retried; see the script)
        shell: bash
        run: scripts/go-download.sh
      - name: Frontend build (the Go code embeds it)
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - run: go vet ./...
      - run: go test -short ./...
